<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>YouTube Kiosk</title>

  <!-- NIENTE viewport avanzato: Chromium 72 impazzisce -->
  <meta name="referrer" content="origin">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
     iframe {
       transform: scale(1.01);
       transform-origin: 0 0;
     }
    /* Contenitore aspect-ratio 16:9 */
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .video-container::before {
      content: "";
      display: block;
      padding-top: 56.25%; /* 16:9 */
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="video-container">
    <iframe
      src="https://www.youtube-nocookie.com/embed/EGk3Mr0OshE?si=FipiRo8ADHv8fxSc?rel=0&autoplay=1"
      title="Nunziata di Mascali"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>
  <!--src="https://www.youtube-nocookie.com/embed/KB3f4zmkqcM?si=YBJWUIN07B63RzGQ?rel=0&autoplay=1" title="Zafferana"-->

</body>
</html>
