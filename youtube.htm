<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      frame-src https://www.youtube.com https://www.youtube-nocookie.com;
      style-src 'self' 'unsafe-inline';
    ">

  <meta name="referrer" content="origin">
  <title>YouTube Embed Relay</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    .video-wrapper {
      position: fixed;
      inset: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="video-wrapper">
    <iframe
      src="https://www.youtube-nocookie.com/embed/iOR1htkbkNI?si=1lyka2WiMNw_HLh2?autoplay=1&mute=1&playsinline=1&rel=0"
      title="Santa Venerina"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
