<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>YouTube Kiosk</title>

  <!-- NIENTE viewport avanzato: Chromium 72 impazzisce -->
  <meta name="referrer" content="origin">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    /* Contenitore aspect-ratio 16:9 */
    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .video-container::before {
      content: "";
      display: block;
      padding-top: 56.25%; /* 16:9 */
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="video-container">
    <iframe
      src="https://www.youtube-nocookie.com/embed/iOR1htkbkNI?si=1lyka2WiMNw_HLh2?autoplay=1&mute=1&rel=0"
      title="Santa Venerina"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
